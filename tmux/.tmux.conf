# Enable mouse support (scrolling, selecting panes, resizing)  
set -g mouse on  
set -g allow-passthrough on

# Use 256 colors and enable True Color support  
set -g default-terminal "tmux-256color"

# Enable system clipboard integration  
set-option -g set-clipboard on  

unbind C-b  
set-option -g prefix C-space  
bind C-space send-prefix  

# Session management
bind C-k kill-session
bind s choose-tree -s

bind . command-prompt -I "#S" "rename-session '%%'"

# Window management
bind t new-window
bind w kill-window

# Split panes with easier shortcuts  
bind | split-window -h  # Horizontal split  
bind - split-window -v  # Vertical split  
bind q kill-pane

# Reload config without restarting tmux  
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"  

# No date on the right side
set-option -g status-right ""  

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# Changing panes
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

# NOTE: This has to go here. At the end of the file it doesn't work. 
set -g automatic-rename on
setw -g automatic-rename on

# Use vi-style keybindings in copy mode  
set-window-option -g mode-keys vi  
bind v copy-mode 
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel

# List of plugins  
set -g @plugin 'tmux-plugins/tpm'  
set -g @plugin 'tmux-plugins/tmux-resurrect' # Saves & restores sessions  
# set -g @plugin 'tmux-plugins/tmux-copycat'   # Better copy mode  
set -g @plugin 'tmux-plugins/tmux-yank'      # System clipboard support  
set -g @plugin 'tmux-plugins/tmux-sensible'  # Better defaults such as a reasonable history limits.

# for neovim
set -g @resurrect-strategy-nvim 'session'

# Themes
set -g @plugin 'catppuccin/tmux'
set -g @catppuccin_flavour 'Macchiato' # Latte, Frappé, Macchiato, or Mocha

# set -g @plugin 'janoamaral/tokyo-night-tmux'
# set -g @tokyo-night-tmux_theme 'night' # or 'day', 'storm'# Initialize TPM  
run '~/.tmux/plugins/tpm/tpm'  

# NOTE: Has to go after we load the plugins. It is hardcoded for catppucin, otherwise if you make it general you lose the styling. 

# But if you rename manually, tmux won't override it
set -g allow-rename off

# Use process name if untouched, otherwise show manual name
set -gq @catppuccin_window_text " #W"
set -gq @catppuccin_window_current_text " #W"
