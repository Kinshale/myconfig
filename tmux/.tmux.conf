# Enable mouse support (scrolling, selecting panes, resizing)  
set -g mouse on
setw -g mode-keys vi
set -g allow-passthrough on

# Use 256 colors and enable True Color support  
set -g default-terminal "tmux-256color"

# Enable system clipboard integration  
set-option -g set-clipboard on  

# NOTE: Shortcuts

unbind C-b  
set-option -g prefix C-space  
bind C-space send-prefix  

bind t new-window
bind q kill-window
bind w kill-pane

bind | split-window -h
bind - split-window -v

bind C-k kill-session
bind / choose-tree -s

bind . command-prompt -I "#S" "rename-session '%%'"

bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

# # Reload config without restarting tmux (Never used this)
# bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"  

# NOTE: Appeareance

# Status bar
set-option -g status-position bottom

# Renumber windows
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# Fix window renaming
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"
set -g @catppuccin_window_default_text " #W"

# # Make the status line pretty and add some modules
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_uptime}"

# TODO: Current window rounded style.

# NOTE: Plugins
set -g @plugin 'tmux-plugins/tpm'  
set -g @plugin 'tmux-plugins/tmux-resurrect' # Saves & restores sessions  
# set -g @plugin 'tmux-plugins/tmux-copycat'   # Better copy mode  
set -g @plugin 'tmux-plugins/tmux-yank'      # System clipboard support  
set -g @plugin 'tmux-plugins/tmux-sensible'  # Better defaults such as a reasonable history limits.

# Themes
set -g @plugin 'catppuccin/tmux'
set -g @catppuccin_flavour 'Macchiato' # Latte, Frappé, Macchiato, or Mocha
# set -g @plugin 'janoamaral/tokyo-night-tmux'
# set -g @tokyo-night-tmux_theme 'night' # or 'day', 'storm'# Initialize TPM  

run '~/.tmux/plugins/tpm/tpm'  
